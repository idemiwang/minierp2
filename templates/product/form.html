{% extends "base.html" %}
{% block title %}{{ '編輯物料' if product else '新增物料' }} - MiniERP{% endblock %}
{% block content %}
<h3>{{ '編輯物料 ' + product.ProductId if product else '新增物料' }}</h3>
<form method="post" class="mt-3" style="max-width: 480px;">
  {% if not product %}
  <div class="mb-3">
    <label class="form-label">物料編號</label>
    <input type="text" class="form-control" value="(系統自動編號)" disabled>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">物料名稱</label>
    <input type="text" name="product_name" class="form-control" value="{{ form_values.product_name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">庫存餘額</label>
    <input type="number" step="0.001" name="stock_balance" class="form-control" value="{{ form_values.stock_balance }}">
  </div>
  <button type="submit" class="btn btn-primary">儲存</button>
  <a href="{{ url_for('product.list_view') }}" class="btn btn-outline-secondary">取消</a>
</form>
{% endblock %}
