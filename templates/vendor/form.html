{% extends "base.html" %}
{% block title %}{{ '編輯廠商' if vendor else '新增廠商' }} - 泰國兒童才藝發展基金會{% endblock %}
{% block content %}
<h3>{{ '編輯廠商 ' + vendor.VendorId if vendor else '新增廠商' }}</h3>
<form method="post" class="mt-3" style="max-width: 480px;">
  {% if not vendor %}
  <div class="mb-3">
    <label class="form-label">廠商編號</label>
    <input type="text" class="form-control" value="(系統自動編號)" disabled>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">廠商名稱</label>
    <input type="text" name="vendor_name" class="form-control" value="{{ form_values.vendor_name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">電話</label>
    <input type="text" name="phone" class="form-control" value="{{ form_values.phone }}">
  </div>
  <button type="submit" class="btn btn-primary">儲存</button>
  <a href="{{ url_for('vendor.list_view') }}" class="btn btn-outline-secondary">取消</a>
</form>
{% endblock %}
