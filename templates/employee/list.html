{% extends "base.html" %}
{% block title %}員工管理 - 泰國兒童才藝發展基金會{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>🎀 員工管理</h3>
  <a href="{{ url_for('employee.create_view') }}" class="btn btn-primary">+ 新增員工</a>
</div>
<table class="table table-striped table-hover">
  <thead><tr><th>員工編號</th><th>姓名</th><th>Email</th><th class="text-end">操作</th></tr></thead>
  <tbody>
    {% for e in employees %}
    <tr>
      <td><a href="{{ url_for('employee.detail_view', employee_id=e.EmployeeId) }}">{{ e.EmployeeId }}</a></td>
      <td>{{ e.EmployeeName }}</td>
      <td>{{ e.Email or '' }}</td>
      <td class="text-end">
        <a href="{{ url_for('employee.edit_view', employee_id=e.EmployeeId) }}" class="btn btn-sm btn-outline-secondary">編輯</a>
        <form action="{{ url_for('employee.delete_view', employee_id=e.EmployeeId) }}" method="post" class="d-inline"
              onsubmit="return confirm('確定要刪除員工 {{ e.EmployeeId }} 嗎?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">尚無資料</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
