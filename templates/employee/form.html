{% extends "base.html" %}
{% block title %}{{ '編輯員工' if employee else '新增員工' }} - 泰國兒童才藝發展基金會{% endblock %}
{% block content %}
<h3>{{ '編輯員工 ' + employee.EmployeeId if employee else '新增員工' }}</h3>
<form method="post" class="mt-3" style="max-width: 480px;">
  {% if not employee %}
  <div class="mb-3">
    <label class="form-label">員工編號</label>
    <input type="text" class="form-control" value="(系統自動編號)" disabled>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">姓名</label>
    <input type="text" name="employee_name" class="form-control" value="{{ form_values.employee_name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" value="{{ form_values.email }}">
  </div>
  <button type="submit" class="btn btn-primary">儲存</button>
  <a href="{{ url_for('employee.list_view') }}" class="btn btn-outline-secondary">取消</a>
</form>
{% endblock %}
