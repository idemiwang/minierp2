{% extends "base.html" %}
{% block title %}{{ '編輯客戶' if customer else '新增客戶' }} - 泰國兒童才藝發展基金會{% endblock %}
{% block content %}
<h3>{{ '編輯客戶 ' + customer.CustomerId if customer else '新增客戶' }}</h3>
<form method="post" class="mt-3" style="max-width: 480px;">
  {% if not customer %}
  <div class="mb-3">
    <label class="form-label">客戶編號</label>
    <input type="text" class="form-control" value="(系統自動編號)" disabled>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">客戶名稱</label>
    <input type="text" name="customer_name" class="form-control" value="{{ form_values.customer_name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">電話</label>
    <input type="text" name="phone" class="form-control" value="{{ form_values.phone }}">
  </div>
  <button type="submit" class="btn btn-primary">儲存</button>
  <a href="{{ url_for('customer.list_view') }}" class="btn btn-outline-secondary">取消</a>
</form>
{% endblock %}
