{% extends "base.html" %}
{% block title %}{{ '編輯倉別' if warehouse else '新增倉別' }} - 泰國兒童才藝發展基金會{% endblock %}
{% block content %}
<h3>{{ '編輯倉別 ' + warehouse.WarehouseId if warehouse else '新增倉別' }}</h3>
<form method="post" class="mt-3" style="max-width: 480px;">
  {% if not warehouse %}
  <div class="mb-3">
    <label class="form-label">倉別編號</label>
    <input type="text" class="form-control" value="(系統自動編號)" disabled>
  </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">倉別名稱</label>
    <input type="text" name="warehouse_name" class="form-control" value="{{ form_values.warehouse_name }}" required>
  </div>
  <button type="submit" class="btn btn-primary">儲存</button>
  <a href="{{ url_for('warehouse.list_view') }}" class="btn btn-outline-secondary">取消</a>
</form>
{% endblock %}
