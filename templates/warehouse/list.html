{% extends "base.html" %}
{% block title %}倉別管理 - 泰國兒童才藝發展基金會{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>🏬 倉別管理</h3>
  <a href="{{ url_for('warehouse.create_view') }}" class="btn btn-primary">+ 新增倉別</a>
</div>
<table class="table table-striped table-hover">
  <thead><tr><th>倉別編號</th><th>倉別名稱</th><th class="text-end">操作</th></tr></thead>
  <tbody>
    {% for w in warehouses %}
    <tr>
      <td>{{ w.WarehouseId }}</td>
      <td>{{ w.WarehouseName }}</td>
      <td class="text-end">
        <a href="{{ url_for('warehouse.edit_view', warehouse_id=w.WarehouseId) }}" class="btn btn-sm btn-outline-secondary">編輯</a>
        <form action="{{ url_for('warehouse.delete_view', warehouse_id=w.WarehouseId) }}" method="post" class="d-inline"
              onsubmit="return confirm('確定要刪除倉別 {{ w.WarehouseId }} 嗎?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="text-center text-muted">尚無資料</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
