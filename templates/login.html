<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 - MiniERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card login-card shadow-sm" style="width: 23rem;">
      <div class="card-body text-center">
        <div style="font-size: 2.5rem;">🧸🍡🎀</div>
        <h4 class="card-title mb-1">MiniERP 登入</h4>
        <p class="text-muted small mb-3">今天也要元氣滿滿地上班唷 🌸</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="post" class="text-start">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label">帳號</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">密碼</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">💖 登入 💖</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
