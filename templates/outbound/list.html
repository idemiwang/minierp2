{% extends "base.html" %}
{% block title %}出庫管理 - 泰國兒童才藝發展基金會{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>🚛 出庫管理</h3>
  <a href="{{ url_for('outbound.create_view') }}" class="btn btn-primary">+ 新增出庫單</a>
</div>
<table class="table table-striped table-hover">
  <thead><tr><th>出庫單號</th><th>日期</th><th>經手員工</th><th>行數</th><th class="text-end">操作</th></tr></thead>
  <tbody>
    {% for h in headers %}
    <tr>
      <td><a href="{{ url_for('outbound.detail_view', outbound_id=h.OutboundId) }}">{{ h.OutboundId }}</a></td>
      <td>{{ h.OutboundDate }}</td>
      <td>{{ h.EmployeeName }}</td>
      <td>{{ h.LineCount }}</td>
      <td class="text-end">
        <a href="{{ url_for('outbound.edit_view', outbound_id=h.OutboundId) }}" class="btn btn-sm btn-outline-secondary">編輯</a>
        <a href="{{ url_for('outbound.export_view', outbound_id=h.OutboundId) }}" class="btn btn-sm btn-outline-success">匯出</a>
        <form action="{{ url_for('outbound.delete_view', outbound_id=h.OutboundId) }}" method="post" class="d-inline"
              onsubmit="return confirm('確定要刪除出庫單 {{ h.OutboundId }} 嗎?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5" class="text-center text-muted">尚無資料</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
